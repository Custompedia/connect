# Konfigurasi Cloudflare Pages (static + Functions).
# Hanya folder `public/` yang disajikan publik; `functions/` jadi serverless,
# `lib/` di-bundle ke Functions (tidak ikut disajikan sebagai aset statis).

name = "custompedia-connect"
compatibility_date = "2026-06-01"
pages_build_output_dir = "public"

# KV untuk rate limit per-IP (§7). Buat namespace lalu ganti `id` di bawah:
#   npx wrangler kv namespace create RATE_LIMIT
# Untuk dev lokal, wrangler menyimulasikan KV ini secara lokal.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Catatan: SECRET (NOTION_TOKEN, RESEND_API_KEY, dll.) JANGAN ditaruh di sini.
# Lokal: pakai file .dev.vars. Produksi: set di dashboard Pages > Settings >
# Environment variables (tandai sebagai "Encrypt").
