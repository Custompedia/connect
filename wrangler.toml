# Konfigurasi Cloudflare Worker (Workers + Static Assets).
# - `public/` disajikan sebagai aset statis lewat binding ASSETS.
# - `worker/index.js` menangani rute non-aset (POST /api/audit-lead, redirect /).
# - `lib/` di-bundle ke Worker.
# Deploy: `npx wrangler deploy` (perintah inilah yang dipakai Workers Builds).

name = "custompedia-connect"
main = "worker/index.js"
compatibility_date = "2026-06-01"

[assets]
directory = "./public"
binding = "ASSETS"

# KV untuk rate limit per-IP (§7). NONAKTIF sampai namespace dibuat.
# Kode fail-open bila binding RATE_LIMIT tidak ada (lib/ratelimit.js), jadi
# halaman & endpoint tetap jalan tanpa KV (rate-limit dilewati sementara).
# Untuk MENGAKTIFKAN:
#   1) npx wrangler kv namespace create RATE_LIMIT
#   2) uncomment blok di bawah & isi `id` hasil perintah di atas.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Catatan: SECRET (NOTION_TOKEN, RESEND_API_KEY, dll.) JANGAN ditaruh di sini.
# Lokal: pakai file .dev.vars. Produksi: set di dashboard Worker > Settings >
# Variables and Secrets (tandai sebagai "Encrypt"), atau `wrangler secret put`.
